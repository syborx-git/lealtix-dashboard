server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Habilitar compresión Gzip para mejorar rendimiento
    gzip on;
    # El nginx del host hace proxy en HTTP/1.0; sin esto nginx NO comprime
    # (por defecto gzip_http_version es 1.1). Este fue el motivo de que el
    # dashboard bajara JS/CSS sin comprimir (~7x más pesado).
    gzip_http_version 1.0;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/manifest+json font/woff font/woff2;

    # Configuración para Angular SPA (Single Page Application)
    # Redirige cualquier ruta que no sea un archivo físico hacia index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html sin caché: garantiza que cada deploy tome efecto de inmediato
    # (evita que el navegador siga usando un build viejo con chunks ya inexistentes)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Service worker, manifest y safety worker: SIN caché (deben actualizarse en cada deploy).
    # Debe ir ANTES del bloque genérico de estáticos para ganar el match.
    location ~* ^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js|ngsw/) {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Manifest con su MIME correcto (nginx no conoce .webmanifest por defecto)
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Optimización de caché para archivos estáticos
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6m;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # =========================================================================
    # OPCIONAL: Proxy Inverso para el Backend (si prefieres evitar CORS en prod)
    # =========================================================================
    # Si en el futuro deseas que Nginx reenvíe las peticiones /api/ directamente
    # a tu Backend (ej. Spring Boot), descomenta la siguiente sección:
    #
    # location /api/ {
    #     proxy_pass http://backend-container:8080/api/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_cache_bypass $http_upgrade;
    # }
}
