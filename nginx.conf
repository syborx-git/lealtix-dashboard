server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Habilitar compresión Gzip para mejorar rendimiento
    gzip on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Configuración para Angular SPA (Single Page Application)
    # Redirige cualquier ruta que no sea un archivo físico hacia index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optimización de caché para archivos estáticos
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6m;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # =========================================================================
    # OPCIONAL: Proxy Inverso para el Backend (si prefieres evitar CORS en prod)
    # =========================================================================
    # Si en el futuro deseas que Nginx reenvíe las peticiones /api/ directamente
    # a tu Backend (ej. Spring Boot), descomenta la siguiente sección:
    #
    # location /api/ {
    #     proxy_pass http://backend-container:8080/api/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_cache_bypass $http_upgrade;
    # }
}
