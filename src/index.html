<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Lealtix - Dashboard</title>
        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
        <link rel="icon" type="image/png" sizes="32x32" href="https://res.cloudinary.com/lealtix-media/image/upload/w_32,h_32,c_fill,f_png,q_auto/v1759897289/lealtix_logo_transp_qcp5h9.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="https://res.cloudinary.com/lealtix-media/image/upload/w_16,h_16,c_fill,f_png,q_auto/v1759897289/lealtix_logo_transp_qcp5h9.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="https://res.cloudinary.com/lealtix-media/image/upload/w_180,h_180,c_fill,f_png,q_auto/v1759897289/lealtix_logo_transp_qcp5h9.png" />
        <link rel="shortcut icon" href="https://res.cloudinary.com/lealtix-media/image/upload/w_32,h_32,c_fill,f_png,q_auto/v1759897289/lealtix_logo_transp_qcp5h9.png" />

        <!-- Bloqueo global de zoom para tablets y sistemas operativos POS/Kiosk -->
        <script>
            (function () {
                // 1. Prevenir pinch-to-zoom táctil (gestos de 2 o más dedos)
                document.addEventListener('touchstart', function (e) {
                    if (e.touches && e.touches.length > 1) {
                        e.preventDefault();
                    }
                }, { passive: false });

                document.addEventListener('touchmove', function (e) {
                    if (e.touches && e.touches.length > 1) {
                        e.preventDefault();
                    }
                }, { passive: false });

                // 2. Prevenir gestos de zoom nativos de WebKit/Safari (iPadOS / iOS)
                document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
                document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
                document.addEventListener('gestureend', function (e) { e.preventDefault(); });

                // 3. Prevenir zoom con Ctrl + Rueda de ratón / Trackpad en laptops o tablets con accesorios
                document.addEventListener('wheel', function (e) {
                    if (e.ctrlKey) {
                        e.preventDefault();
                    }
                }, { passive: false });

                // 4. Prevenir atajos de teclado de zoom (Ctrl +, Ctrl -, Ctrl 0)
                document.addEventListener('keydown', function (e) {
                    if ((e.ctrlKey || e.metaKey) && (
                        e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0' ||
                        e.keyCode === 187 || e.keyCode === 189 || e.keyCode === 48
                    )) {
                        e.preventDefault();
                    }
                });
            })();
        </script>

        <!-- PWA -->
        <link rel="manifest" href="manifest.webmanifest" />
        <meta name="theme-color" content="#33211D" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="Comandix POS" />
        <link rel="apple-touch-icon" href="icons/icon-192.png" />

        <!-- El panel ya NO usa Service Worker. Desregistra cualquier SW/caché viejo
             (de versiones anteriores de la PWA) para evitar "app vieja cacheada". -->
        <script>
            (function () {
                try {
                    if ('serviceWorker' in navigator) {
                        navigator.serviceWorker.getRegistrations().then(function (regs) {
                            regs.forEach(function (r) { r.unregister(); });
                        });
                    }
                    if (window.caches && caches.keys) {
                        caches.keys().then(function (keys) {
                            keys.forEach(function (k) { caches.delete(k); });
                        });
                    }
                } catch (e) { /* ignore */ }
            })();
        </script>

    </head>

    <body>
        <app-root></app-root>
    </body>
</html>
