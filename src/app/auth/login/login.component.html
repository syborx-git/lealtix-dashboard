<app-floating-configurator></app-floating-configurator>
<p-toast></p-toast>

<div class="login-page-container light-login">
    <!-- Animated background patterns and glowing blobs -->
    <div class="bg-glow-container">
        <div class="glow-blob-1"></div>
        <div class="glow-blob-2"></div>
    </div>

    <!-- Glass card container -->
    <div class="login-card-wrapper">
        <div class="glass-card">
            <!-- Header Section -->
            <div class="text-center mb-8">
                <img src="../../../assets/layout/images/lealtix_logo_transp.png" 
                     alt="Lealtix Logo" 
                     class="login-logo mb-6 w-36 sm:w-44 max-w-full mx-auto" />
                
                <h1 class="login-title">Bienvenido a Lealtix</h1>
                <p class="login-subtitle">Inicia sesión para continuar</p>
            </div>

            <!-- Form Section -->
            <div>
                <!-- Email Input -->
                <div class="form-group animate-fade-in-up animate-delay-1">
                    <label for="email1" class="form-label">Email</label>
                    <input pInputText
                           id="email1"
                           type="email"
                           placeholder="correo@example.com"
                           class="w-full"
                           [(ngModel)]="email"
                           [disabled]="loading" />
                </div>

                <!-- Password Input -->
                <div class="form-group animate-fade-in-up animate-delay-2">
                    <label for="password1" class="form-label">Contraseña</label>
                    <p-password id="password1"
                                [(ngModel)]="password"
                                placeholder="Ingresa tu contraseña"
                                [toggleMask]="true"
                                [fluid]="true"
                                [feedback]="false"
                                [disabled]="loading"></p-password>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="remember-me-container animate-fade-in-up animate-delay-3">
                    <div class="flex items-center">
                        <p-checkbox [(ngModel)]="checked" id="rememberme1" binary class="mr-2"></p-checkbox>
                        <label for="rememberme1" class="checkbox-label">Recuérdame</label>
                    </div>
                    <span class="forgot-link">¿Olvidé mi contraseña?</span>
                </div>

                <!-- Error Message Display -->
                <div *ngIf="errorMessage" class="error-message">
                    <i class="pi pi-exclamation-circle"></i>
                    <span>{{ errorMessage }}</span>
                </div>

                <!-- Submit Button -->
                <div class="submit-btn animate-fade-in-up animate-delay-4">
                    <p-button label="Iniciar Sesión"
                              styleClass="w-full"
                              [loading]="loading"
                              (onClick)="submit()"></p-button>
                </div>

                <!-- Help Text -->
                <div class="help-footer animate-fade-in-up animate-delay-5">
                    <p>Solicita tus credenciales al administrador si no los tienes</p>
                </div>
            </div>
        </div>
    </div>
</div>
