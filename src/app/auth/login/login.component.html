<p-toast></p-toast>

<div class="login-page light-login" [ngClass]="{ 'screen-hidden': loading }">
  <div class="login-container">

    <!-- Columna Izquierda: Formulario -->
    <div class="form-side">
      <div>
        <div class="logo">
          <img src="https://res.cloudinary.com/lealtix-media/image/upload/q_auto/f_auto/v1759897289/lealtix_logo_transp_qcp5h9.png"
               alt="Lealtix Logo" class="login-logo" />
        </div>

        <h2>Bienvenido a Lealtix</h2>
        <p class="subtitle">Inicia sesión para gestionar tu negocio, tus clientes y tus campañas.</p>
      </div>

      <form (ngSubmit)="submit()">
        <div class="input-group">
          <label for="email">Email</label>
          <div class="input-wrapper">
            <i class="pi pi-envelope"></i>
            <input pInputText id="email" type="email" placeholder="correo@ejemplo.com"
                   [(ngModel)]="email" name="email" [disabled]="loading" />
          </div>
        </div>

        <div class="input-group">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <i class="pi pi-lock"></i>
            <input pInputText id="password" type="password" placeholder="Ingresa tu contraseña"
                   [(ngModel)]="password" name="password" [disabled]="loading" />
          </div>
        </div>

        <div class="forgot-password">
          <a href="#">¿Olvidaste tu contraseña?</a>
        </div>

        <div *ngIf="errorMessage" class="error-message">
          <i class="pi pi-exclamation-circle"></i>
          <span>{{ errorMessage }}</span>
        </div>

        <button type="submit" class="btn-submit" [disabled]="loading">
          <span *ngIf="!loading">Iniciar Sesión</span>
          <span *ngIf="loading" class="btn-loading">
            <span class="spinner"></span> Cargando...
          </span>
        </button>
      </form>

      <div class="footer-link">
        <a href="#">© 2026. Powered by Lealtix</a>
      </div>
    </div>

    <!-- Columna Derecha: Imagen -->
    <div class="image-side">
      <div class="image-brand">
        <div class="brand-orb">
          <img src="https://res.cloudinary.com/lealtix-media/image/upload/q_auto/f_auto/v1759897289/lealtix_logo_transp_qcp5h9.png" alt="Lealtix" class="brand-logo" />
        </div>
        <h3>Lealtix</h3>
        <p>Fideliza a tus clientes y haz crecer tu negocio</p>
      </div>
    </div>

  </div>
</div>

<!-- Pantalla de carga: transición con el loader a pantalla completa -->
<div class="loader-screen" [ngClass]="{ 'loader-visible': loading }">
  <div class="loader"></div>
</div>
