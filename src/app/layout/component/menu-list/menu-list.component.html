<!--
  Lista de navegación: Secciones principales y opciones desplegadas
-->
<nav class="flex flex-col gap-1.5" [class.is-mobile]="mobile" aria-label="Navegación principal">
    <div *ngFor="let section of filteredSections()" class="flex flex-col">
        <!-- ============ Encabezado de la Sección ============ -->
        <button
            type="button"
            class="menu-section-btn group relative flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left transition-all duration-200"
            [class.active]="isOpen(section)"
            [attr.aria-expanded]="isOpen(section)"
            [attr.aria-label]="section.label"
            (click)="onSectionClick(section)"
        >
            <!-- Ícono principal de la categoría -->
            <i
                class="pi shrink-0 text-base transition-colors duration-200"
                [ngClass]="section.icon"
            ></i>

            <!-- Etiqueta de la categoría -->
            <span class="min-w-0 flex-1 overflow-hidden whitespace-nowrap text-xs font-semibold tracking-wide">
                {{ section.label }}
            </span>

            <!-- Flecha de despliegue -->
            <i
                class="pi pi-angle-down shrink-0 text-[0.7rem] transition-transform duration-300 opacity-60 group-hover:opacity-100"
                [class.rotate-180]="isOpen(section)"
            ></i>
        </button>

        <!-- ============ Submenú / Opciones Desplegadas ============ -->
        <div
            class="grid transition-all duration-300 ease-in-out"
            [ngClass]="[
                isOpen(section) ? 'grid-rows-[1fr] opacity-100 my-1' : 'grid-rows-[0fr] opacity-0 pointer-events-none'
            ]"
        >
            <ul class="min-h-0 overflow-hidden flex flex-col gap-1 pl-3 pr-1">
                <li *ngFor="let item of itemsOf(section)">
                    <a
                        class="menu-sub-link flex items-center gap-3 rounded-xl px-3 py-2 text-xs font-medium transition-all duration-200"
                        [ngClass]="item.disabled ? 'cursor-not-allowed opacity-40 hover:bg-transparent' : ''"
                        [routerLink]="item.disabled ? null : item.routerLink"
                        routerLinkActive="sub-item-active"
                        [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored' }"
                        [attr.title]="item.disabled ? (item.title || 'No disponible') : item.label"
                        (click)="onItemClick(item)"
                    >
                        <i class="pi shrink-0 text-xs transition-colors" [ngClass]="item.icon"></i>
                        <span class="truncate min-w-0 flex-1">{{ item.label }}</span>

                        <!-- Candado de bloqueo de permisos o estado -->
                        <i
                            *ngIf="item.disabled"
                            class="pi pi-lock shrink-0 text-[0.65rem] text-amber-500"
                            [title]="item.title || 'No disponible'"
                        ></i>
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <!-- Mensaje cuando la búsqueda no coincide -->
    <div
        *ngIf="filteredSections().length === 0"
        class="px-3 py-6 text-center text-xs text-slate-400"
    >
        No se encontraron opciones para "{{ searchQuery }}"
    </div>
</nav>
